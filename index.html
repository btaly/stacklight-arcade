<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111528"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Stacklight"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Stacklight</title></head>
<body><main class="cabinet"><header><div><span class="eyebrow">A POCKET ARCADE ORIGINAL</span><h1>STACK<span>LIGHT</span></h1></div><button id="sound" class="small" aria-label="Toggle sound">♫ ON</button></header><div class="rule"></div><section class="game-layout"><aside class="stats"><div class="stat"><span>TOP SCORE</span><strong id="high">000000</strong></div><div class="stat"><span>SCORE</span><strong id="score">000000</strong></div><div class="stat"><span>LINES</span><strong id="lines">000</strong></div><div class="stat"><span>LEVEL</span><strong id="level">00</strong></div><div class="next"><span>NEXT UP</span><canvas id="next" width="96" height="72" aria-label="Next piece"></canvas></div></aside><div class="board-wrap"><canvas id="board" width="240" height="480" aria-label="Game board"></canvas><div id="overlay" class="overlay"><div><span class="spark">✦</span><h2 id="message">READY<br>PLAYER ONE?</h2><p id="hint">A LITTLE STACK GOES A LONG WAY.</p><button id="start" class="primary">START GAME <span>▶</span></button></div></div></div></section><div class="under"><span>● &nbsp; CLASSIC MODE</span><button id="pause" class="text-button">Ⅱ &nbsp; PAUSE</button></div><div class="control-setting"><button id="control-mode" type="button" aria-label="Switch movement controls"></button></div><section class="controls" aria-label="Touch controls"><div id="joystick" class="joystick" aria-label="Joystick: drag left, right, or down"><span class="joystick-arrows" aria-hidden="true">◀　▼　▶</span><span id="stick" class="stick" aria-hidden="true"></span></div><div id="dpad" class="dpad" hidden><button data-action="left" aria-label="Move left">◀</button><button data-action="down" aria-label="Soft drop">▼</button><button data-action="right" aria-label="Move right">▶</button></div><div class="action-buttons"><button data-action="cw" aria-label="Rotate clockwise" type="button">↷<small>ROTATE</small></button></div></section><footer><span>← → MOVE &nbsp; ↓ DROP &nbsp; Z / X ROTATE</span><span>BUILT FOR THE HIGH SCORE ✦</span></footer></main><script type="module" src="app.js"></script></body></html>
